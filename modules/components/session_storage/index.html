<!doctype html>
<html>
<head>
<meta charset="utf-8" />
</head>
<body>
<script>
    // ------------------------------------------------------------------
    // Protocolo mínimo de "componente estático" do Streamlit (sem React,
    // sem build) — mesmo padrão do youtube_tracker. Este componente não
    // desenha nada (altura 0): só lê/grava o token de sessão no
    // localStorage do navegador, pra manter o aluno logado mesmo quando a
    // URL não carrega o token (ex: abrindo a plataforma de novo por um
    // favorito/atalho "limpo", sem o parâmetro de sessão na URL).
    // ------------------------------------------------------------------
    function enviarParaStreamlit(tipo, dados) {
        var payload = Object.assign({ isStreamlitMessage: true, type: tipo }, dados);
        window.parent.postMessage(payload, "*");
    }

    function enviarValor(valor) {
        enviarParaStreamlit("streamlit:setComponentValue", { value: valor, dataType: "json" });
    }

    var CHAVE = "nortetel_sessao";

    function aoReceberMensagem(evento) {
        if (!evento.data || evento.data.type !== "streamlit:render") return;
        var args = evento.data.args || {};
        try {
            if (args.acao === "ler") {
                var salvo = window.localStorage.getItem(CHAVE);
                enviarValor(salvo === null ? "" : salvo);
            } else if (args.acao === "gravar") {
                window.localStorage.setItem(CHAVE, args.token || "");
                enviarValor(args.token || "");
            } else if (args.acao === "apagar") {
                window.localStorage.removeItem(CHAVE);
                enviarValor("");
            }
        } catch (erro) {
            // localStorage pode estar bloqueado (modo privado restrito etc.)
            // — nesse caso só não persiste entre aberturas, sem quebrar o app.
            enviarValor("");
        }
    }

    window.addEventListener("message", aoReceberMensagem);
    document.addEventListener("DOMContentLoaded", function () {
        enviarParaStreamlit("streamlit:componentReady", { apiVersion: 1 });
        enviarParaStreamlit("streamlit:setFrameHeight", { height: 0 });
    });
</script>
</body>
</html>
