{% extends "base.html" %}
{% block titulo %}Foto de perfil — Norte Tel{% endblock %}
{% block cabecalho_extra %}
<script src="/static/js/foto-perfil.js" defer></script>
{% endblock %}
{% block conteudo %}
<div class="max-w-md mx-auto glass-card rounded-2xl p-8"
     x-data="{ preview: null, enviando: false }"
     x-init="ligarCompressaoDeFoto($refs.inputFoto, (url) => preview = url)">
    <h1 class="text-xl font-bold text-blue-400 mb-2">📷 Adicione sua foto de perfil</h1>
    <p class="text-sm text-slate-400 mb-6">Antes de continuar, defina uma foto de perfil. É só dessa vez.</p>

    {% if erro %}
    <div class="mb-4 rounded-lg bg-red-500/10 border border-red-500/20 text-red-300 text-sm px-4 py-3">{{ erro }}</div>
    {% endif %}

    <form action="/definir-foto-obrigatoria" method="post" enctype="multipart/form-data" class="space-y-4" @submit="enviando = true">
        <input type="file" name="foto" x-ref="inputFoto" accept="image/jpeg,image/png,image/heic,image/heif" required
               class="block w-full text-sm text-slate-300 file:mr-4 file:rounded-lg file:border-0 file:bg-white/10 file:px-4 file:py-2 file:text-sm file:font-medium file:text-slate-200 hover:file:bg-white/20">

        <template x-if="preview">
            <img :src="preview" alt="Pré-visualização" class="w-32 h-32 rounded-full object-cover mx-auto ring-2 ring-white/10">
        </template>

        <button type="submit" :disabled="enviando"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg py-2.5 transition disabled:opacity-60 disabled:cursor-not-allowed neon-btn-glow">
            <span x-text="enviando ? 'Enviando, aguarde...' : 'Salvar foto e continuar'"></span>
        </button>
    </form>
</div>
{% endblock %}
