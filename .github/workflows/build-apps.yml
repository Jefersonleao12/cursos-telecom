name: Build APK e EXE

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "mobile-app/**"
      - "desktop-app/**"
      - ".github/workflows/build-apps.yml"

jobs:
  build-apk:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK (debug, já assinado com chave de depuração)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TreinamentosTelecom-android
          path: mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-exe:
    name: Build EXE (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Compilar instalador e versão portátil (.exe)
        run: npm run dist:win

      - name: Publicar EXE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TreinamentosTelecom-windows
          path: |
            desktop-app/release/*.exe
          if-no-files-found: error
