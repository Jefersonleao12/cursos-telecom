[theme]
base = "light"
primaryColor = "#143C6E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4F8"
textColor = "#1A1A1A"
font = "sans serif"

[client]
# Esconde o menu "⋮" (onde fica "Settings" -> tema claro/escuro).
# Sem esse menu, o usuário não consegue trocar para o tema escuro:
# o app sempre usa o tema definido acima em [theme].
toolbarMode = "minimal"

[server]
maxUploadSize = 5
# Necessário para servir os arquivos da PWA (manifest.json, ícones, service worker)
# que ficam na pasta static/. Sem isso, o app não pode ser "instalado" no celular.
enableStaticServing = true
